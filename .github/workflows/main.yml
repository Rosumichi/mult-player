name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание кода из репозитория
        uses: actions/checkout@v4

      - name: Установка Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Создание Android-оболочки и настройка разрешений
        run: |
          mkdir -p /tmp/android_tpl
          cd /tmp/android_tpl
          flutter create --platforms=android --project-name mult_player .
          cp -r /tmp/android_tpl/android "$GITHUB_WORKSPACE/android"
          cd "$GITHUB_WORKSPACE"
          sed -i 's|<application|<uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          if [ -f android/build.gradle.kts ]; then
            cat << 'EOF' >> android/build.gradle.kts
          subprojects {
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.LibraryExtension> {
                      if (namespace.isNullOrEmpty()) {
                          namespace = group.toString().ifEmpty { "com.multplayer.${project.name.replace('-', '_')}" }
                      }
                  }
              }
          }
          EOF
          elif [ -f android/build.gradle ]; then
            cat << 'EOF' >> android/build.gradle
          subprojects {
              plugins.withId("com.android.library") {
                  if (project.android.namespace == null || project.android.namespace.isEmpty()) {
                      project.android.namespace = project.group ? project.group.toString() : "com.multplayer.${project.name.replace('-', '_')}"
                  }
              }
          }
          EOF
          fi

      - name: Загрузка библиотек и сборка APK
        run: |
          flutter pub get
          for f in /home/runner/.pub-cache/hosted/pub.dev/video_thumbnail-*/android/build.gradle; do
            if [ -f "$f" ]; then
              sed -i 's/jcenter()/mavenCentral()/g' "$f"
              sed -i 's/compileSdkVersion [0-9]\+/compileSdkVersion 35/g' "$f"
              grep -q "namespace" "$f" || sed -i 's/android {/android {\n    namespace "xyz.justsoft.video_thumbnail"/' "$f"
            fi
          done
          flutter build apk --release

      - name: Сохранение готового APK
        uses: actions/upload-artifact@v4
        with:
          name: MultPlayer-APK
          path: build/app/outputs/flutter-apk/app-release.apk
